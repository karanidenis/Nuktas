server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to backend.
    # Resolve `server` at request time (Docker DNS) via a variable, so a
    # recreated server container (new IP) does not leave nginx with a stale IP.
    location /api {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://server:4000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy Socket.IO (needs WebSocket upgrade)
    location /socket.io {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://server:4000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
