services:
  - type: web
    name: nuktas-mcp-judge
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./mcp-server/Dockerfile.render
    healthCheckPath: /health
    domains:
      - mcp.nuktas.robopotato.co
    envVars:
      - key: MCP_DATABASE_URL
        fromDatabase:
          name: nuktas-mcp-judge-db
          property: connectionString
      - key: MCP_REMOTE_TOKEN
        sync: false
      - key: MCP_ALLOWED_HOSTS
        value: mcp.nuktas.robopotato.co,nuktas-mcp-judge.onrender.com
      - key: MCP_RATE_LIMIT
        value: 120
      - key: MCP_BOOTSTRAP_SYNTHETIC
        value: true

databases:
  - name: nuktas-mcp-judge-db
    plan: free
    region: frankfurt
    databaseName: nuktas_mcp_judge
    user: nuktas_mcp_judge
